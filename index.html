  const express = require('express');
const fs = require('fs');
const app = express();
app.use(express.json());
app.use(express.static(__dirname));

app.post('/api/votar', (req,res)=>{
  const ip = req.headers['x-forwarded-for']?.split(',')[0] || req.ip;
  const dados = JSON.parse(fs.readFileSync('votos.json'));
  if(dados.ips.includes(ip)) return res.status(403).json({error:'IP já votou'});
  dados[req.body.voto]++; dados.total++; dados.ips.push(ip);
  fs.writeFileSync('votos.json', JSON.stringify(dados,null,2));
  res.json(dados);
});

app.get('/votos.json',(req,res)=> res.json(JSON.parse(fs.readFileSync('votos.json'))));
